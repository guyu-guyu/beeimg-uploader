name: Release

# 推送 tag（如 v1.0.0）时自动构建插件并发布 GitHub Release
# 把 main.js / manifest.json / styles.css 打包成一个 zip 上传，
# 用户下载 zip 解压到 .obsidian/plugins/beeimg-uploader/ 即可安装
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Read version from manifest
        id: manifest
        run: |
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Package into zip
        run: |
          zip_name="beeimg-uploader-${{ steps.manifest.outputs.version }}.zip"
          zip -j "$zip_name" main.js manifest.json styles.css
          echo "zip_name=$zip_name" >> "$GITHUB_ENV"
          ls -la "$zip_name"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            # BeeImg 蜜蜂图床上传 ${{ github.ref_name }}

            ## 安装

            ### 方式一：手动安装（zip）

            1. 下载下方的 `beeimg-uploader-${{ steps.manifest.outputs.version }}.zip`
            2. 解压得到 `main.js`、`manifest.json`、`styles.css` 三个文件
            3. 在你的 Obsidian vault 中创建目录 `.obsidian/plugins/beeimg-uploader/`
            4. 把三个文件放入该目录
            5. Obsidian → 设置 → 第三方插件 → 关闭安全模式 → 启用「BeeImg 蜜蜂图床上传」

            ### 方式二：通过 BRAT 等工具安装

            下方同时提供了 `main.js`、`manifest.json`、`styles.css` 三个单独文件，
            可被 Obsidian 插件管理器（如 [BRAT](https://github.com/TfTHacker/obsidian42-brat)）直接识别。

            ## 配置

            见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)

            ## 变更

            见 [DEV_NOTES](https://github.com/${{ github.repository }}/blob/main/DEV_NOTES.md)
          files: |
            ${{ env.zip_name }}
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
